name: shopy_app
description: "A smart retail & shop management Flutter app."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  logging: ^1.2.0
  shared_preferences: ^2.2.3
  firebase_core: ^2.20.1
  cloud_firestore: ^4.15.9
  firebase_auth: ^4.17.9
  intl: ^0.20.2
  share_plus: ^9.0.0
  pdf: ^3.11.0
  printing: ^5.13.1
  csv: ^5.0.2
  excel: ^4.0.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.0
  fl_chart: ^0.66.0
  data_table_2: ^2.5.7
  open_file: ^3.2.1
  firebase_storage: ^11.0.7
  image_picker: ^1.1.1
  url_launcher: ^6.3.0
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/shopy_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/shopy_logo.png

dependency_overrides:
  printing:
    path: plugins/printing
