name: shopy_app
description: "A smart retail & shop management Flutter app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  logging: ^1.2.0
  shared_preferences: ^2.0.15
  firebase_core: ^2.27.0
  cloud_firestore: ^4.14.0
firebase_auth: ^4.17.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/shopy_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/shopy_logo.png
