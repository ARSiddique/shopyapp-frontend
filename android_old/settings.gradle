// android/settings.gradle (Groovy)

import java.util.Properties

pluginManagement {
    def flutterSdkPath = {
        def props = new Properties()
        def localPropsFile = file("local.properties")

        if (!localPropsFile.exists()) {
            throw new RuntimeException("local.properties not found in /android. Run 'flutter pub get' or create it.")
        }

        localPropsFile.withInputStream { props.load(it) }

        def path = props.getProperty("flutter.sdk")
        if (path == null || path.trim().isEmpty()) {
            throw new RuntimeException("flutter.sdk not set in android/local.properties")
        }
        return path
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
